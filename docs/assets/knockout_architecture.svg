<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="kgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gateGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gateGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gateGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="16" fill="url(#kgBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">
    🛡️ Production Safety &amp; Recruiter Knockout Architecture
  </text>
  <text x="60" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Prevents unrealistic match inflation by enforcing real-world enterprise recruitment boundaries.
  </text>

  <!-- Flowchart Diagram Layout -->
  
  <!-- Step 1: Input -->
  <g transform="translate(60, 130)">
    <rect width="220" height="280" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">1. Raw Evaluation</text>
    <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1">Calculates initial score:</text>
    <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Technical Skills (35%)</text>
    <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Experience Tenure (20%)</text>
    <text x="20" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Education Relevance (10%)</text>
    <text x="20" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Responsibilities (10%)</text>
    <text x="20" y="187" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Competencies (10%)</text>
    <text x="20" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Title / Seniority (5%)</text>
    <text x="20" y="233" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Context &amp; Auth (5%)</text>
    <text x="20" y="256" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">• Calibrated TF-IDF (5%)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 290 270 L 330 270" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="330,265 340,270 330,275" fill="#6366f1"/>

  <!-- Step 2: Knockout Gates Stack -->
  <g transform="translate(350, 130)">
    <!-- Gate 1 -->
    <rect x="0" y="0" width="480" height="85" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#ef4444"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#ffffff">⛔</text>
    <text x="55" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#fca5a5">Gate 1: Seniority Deficit Knockout</text>
    <text x="55" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      If role requires ≥5 yrs &amp; candidate has &lt;40% tenure (e.g. 1.3 vs 7.0 yrs),
    </text>
    <text x="55" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#f87171">
      Action: Disqualify / Cap overall score at ≤ 45% (Low Match)
    </text>

    <!-- Gate 2 -->
    <rect x="0" y="98" width="480" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="113" width="28" height="28" rx="6" fill="#f59e0b"/>
    <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#ffffff">⚠️</text>
    <text x="55" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#fcd34d">Gate 2: Technical Qualification Gate</text>
    <text x="55" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      If candidate misses &gt;50% of core mandatory technical qualifications,
    </text>
    <text x="55" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">
      Action: Enforce hard ceiling at ≤ 58% (Moderate Match)
    </text>

    <!-- Gate 3 -->
    <rect x="0" y="196" width="480" height="84" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="211" width="28" height="28" rx="6" fill="#3b82f6"/>
    <text x="24" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#ffffff">📋</text>
    <text x="55" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#93c5fd">Gate 3: Incomplete JD Guard</text>
    <text x="55" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      If database record contains 0 technical skills (10-word scraped teaser),
    </text>
    <text x="55" y="266" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#60a5fa">
      Action: Enforce uncertainty cap at ≤ 55% to prevent false 94%+ ranks
    </text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="840,265 850,270 840,275" fill="#10b981"/>

  <!-- Step 3: Verified Output -->
  <g transform="translate(860, 130)">
    <rect width="280" height="280" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399">3. Verified Final Score</text>
    
    <rect x="20" y="55" width="240" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#a7f3d0">🎯 100% Recruiter Accurate</text>

    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#f1f5f9">• Explains active safety gates</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#f1f5f9">• Exports transparent DOCX audit</text>
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#f1f5f9">• Generates targeted STAR bullets</text>
    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#f1f5f9">• Bitwise parity between M1 &amp; M2</text>
    
    <g transform="translate(20, 230)">
      <rect width="240" height="30" rx="6" fill="#111827"/>
      <text x="25" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Status: Verified Direct Fit / Gated</text>
    </g>
  </g>
</svg>
