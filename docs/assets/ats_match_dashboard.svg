<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gaugeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="gaugeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="520" rx="16" fill="url(#dbBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Nav Bar Mockup -->
  <rect x="0" y="0" width="1200" height="60" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="35" cy="30" r="14" fill="#6366f1"/>
  <text x="31" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff">A</text>
  <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">ResumeMatch ATS</text>
  
  <rect x="240" y="16" width="320" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="255" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🚀 Mode 2: Auto-Job Recommender (6,200+ Live Jobs)</text>

  <!-- Left: Executive Score Card -->
  <g transform="translate(40, 90)">
    <rect width="450" height="390" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- SVG Radial Gauge -->
    <g transform="translate(145, 120)">
      <!-- Background Track -->
      <circle cx="80" cy="0" r="70" fill="none" stroke="#1e293b" stroke-width="12"/>
      <!-- Filled Track (95.8%) -->
      <circle cx="80" cy="0" r="70" fill="none" stroke="url(#gaugeGreen)" stroke-width="12"
              stroke-dasharray="439.8" stroke-dashoffset="18.4" stroke-linecap="round" filter="url(#gaugeGlow)"
              transform="rotate(-90 80 0)"/>
      <text x="80" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">95.8%</text>
      <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">EXCELLENT MATCH</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">📄 File: Candidate_Resume.pdf</text>

      <rect x="190" y="0" width="105" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="202" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ 7 Matched</text>

      <rect x="305" y="0" width="95" height="26" rx="13" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
      <text x="317" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#bae6fd">⏱️ 1.3 yrs Exp</text>
    </g>

    <!-- Gate Verification Status -->
    <g transform="translate(25, 275)">
      <rect x="0" y="0" width="400" height="42" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">✅ Production Fit Verified: All Core Mandatory Skills Met</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(25, 335)">
      <rect x="0" y="0" width="195" height="36" rx="8" fill="url(#btnGrad)"/>
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff">📥 Download DOCX Report</text>

      <rect x="205" y="0" width="195" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="235" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">📊 View Full Breakdown</text>
    </g>
  </g>

  <!-- Right: Top Ranked Live Job Recommendation Card -->
  <g transform="translate(520, 90)">
    <rect width="640" height="390" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Job Title & Rank -->
    <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">#1 Lead Data &amp; ETL Systems Engineer</text>
    
    <!-- Meta Chips (Generic Anonymized Company) -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="190" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">🏢 Enterprise Cloud Solutions</text>

      <rect x="200" y="0" width="90" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="210" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">📍 Remote</text>

      <rect x="300" y="0" width="80" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="310" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🕒 Recently</text>

      <rect x="390" y="0" width="125" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="400" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34d399">🟢 Full JD (480 words)</text>
    </g>

    <text x="30" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
      Candidate Experience: <tspan font-weight="800" fill="#38bdf8">1.3 yrs</tspan> | Required: <tspan font-weight="800" fill="#f1f5f9">1.0 yrs</tspan> | Gap: <tspan font-weight="800" fill="#34d399">0.0 yrs</tspan>
    </text>

    <!-- Matched Skills Pills -->
    <text x="30" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">Matched Skills:</text>
    <g transform="translate(30, 162)">
      <rect x="0" y="0" width="75" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ python</text>

      <rect x="85" y="0" width="55" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="97" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ sql</text>

      <rect x="150" y="0" width="55" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="162" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ etl</text>

      <rect x="215" y="0" width="95" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="227" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ postgresql</text>

      <rect x="320" y="0" width="85" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="332" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ power bi</text>

      <rect x="415" y="0" width="85" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="427" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">✓ streamlit</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(30, 205)">
      <rect x="0" y="0" width="280" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">🔍 Inspect Full Match</text>

      <rect x="300" y="0" width="280" height="38" rx="8" fill="url(#btnGrad)"/>
      <text x="390" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff">🔗 Apply</text>
    </g>

    <!-- Expanders Preview -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="580" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📄 Complete Job Description (480 words)</text>
      <text x="550" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">▼</text>

      <rect x="0" y="52" width="580" height="58" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
      <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">🎯 Tailored Resume Bullet Points &amp; Summary for This Job</text>
      <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#34d399">🎉 Full Skill Match: Highlight core accomplishments in Python &amp; REST APIs using STAR formula</text>
    </g>
  </g>
</svg>
