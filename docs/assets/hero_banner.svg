<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Decorative Glow Circles -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="320" r="140" fill="#ec4899" opacity="0.1" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="180" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="360" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#38bdf8"/>
    <text x="35" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">🚀 NEXT-GEN EXPLAINABLE ATS INTELLIGENCE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">ResumeMatch ATS</text>
  <text x="60" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
    Production-accurate resume scoring with Knockout Safety Gates, Section-Aware Prioritization, STAR AI Tailoring,
  </text>
  <text x="60" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
    and sub-second career discovery connected live to 6,200+ real-time verified job postings.
  </text>

  <!-- Feature Metric Cards Row -->
  <g transform="translate(60, 240)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="245" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">6,200+</text>
    <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Live Cloud Jobs</text>
    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Real-time catalog filtered by</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">experience &amp; categories</text>

    <!-- Card 2 -->
    <rect x="270" y="0" width="245" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="290" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#34d399">100%</text>
    <text x="290" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Explainable Evidence</text>
    <text x="290" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Zero black box scoring with</text>
    <text x="290" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">exact keyword verification</text>

    <!-- Card 3 -->
    <rect x="540" y="0" width="245" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="560" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f59e0b">🛡️ Knockout</text>
    <text x="560" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Production Safety Gates</text>
    <text x="560" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Seniority shortfall &amp; core</text>
    <text x="560" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">mandatory qualification guards</text>

    <!-- Card 4 -->
    <rect x="810" y="0" width="270" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="830" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ec4899">41/41</text>
    <text x="830" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Pytest Tests Passing</text>
    <text x="830" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">100% green accuracy tests</text>
    <text x="830" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">across API, core, and health</text>
  </g>
</svg>
