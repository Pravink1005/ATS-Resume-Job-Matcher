services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/resume_matcher.db
    volumes:
      - ./data:/app/data
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      MATCHER_API_URL: http://api:8000
    depends_on:
      - api
